name: Claude Code Review

# The review lives in one place, AlterityNetwork/agencycore
# .github/workflows/claude-review-reusable.yml. This file owns the triggers.
on:
  pull_request:
    # synchronize = new commits pushed to the PR branch, so a fix push
    # auto-triggers a fresh review (no @claude needed); @claude still works
    # for on-demand re-reviews.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  # Keep the job id `claude`: the check reads `claude / review`, which
  # ship-await-verdict.sh matches.
  claude:
    uses: AlterityNetwork/agencycore/.github/workflows/claude-review-reusable.yml@staging
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
