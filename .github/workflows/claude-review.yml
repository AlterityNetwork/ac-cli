name: Claude Code Review

on:
  pull_request:
    # synchronize = new commits pushed to the PR branch, so a fix push
    # auto-triggers a fresh review (no @claude needed); @claude still works
    # for on-demand re-reviews.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # pull_request events review non-draft PRs only; ready_for_review starts
    # the first review. Comment events re-review only when a repo collaborator
    # writes "@claude" on an OPEN pull request. This ignores the bot's own
    # comments, skips merged/closed PRs whose refs/pull/N/merge no longer
    # resolves, and stops outside users from starting a secrets-bearing run.
    if: >
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft) ||
      (github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # A new push cancels the review of the previous push. The group is set on
    # the job, not the workflow, so a skipped comment run does not cancel a
    # review. The event name keeps a "@claude" run from cancelling a push
    # review: ship-await-verdict.sh reads a cancelled check on the head as red.
    concurrency:
      group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Hard ceiling so a hung run still reaches a terminal status; the slowest
    # observed submodule review is ~14m, so 20m is comfortable headroom.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          # issue_comment events default to the default branch; pin to the PR
          # merge ref so the review always runs against the PR diff.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are reviewing a pull request in an AgencyCore product
            repository. Flag only what matters: correctness, security,
            performance, and real maintainability problems. Skip nitpicks and
            style preferences.

            ## Earlier review threads

            Before you review, read the existing inline comments:
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/comments --paginate`
            Do not post a finding that an existing comment already holds.
            Do not post again a finding that the current code fixes. Read the
            file to decide; the comment's commit id does not prove it.

            ## Verify before you post

            Post a finding only when you can name the input or state that
            causes the failure and point to the code path that reaches it.
            Drop a finding that depends on an assumption you cannot check in
            the repository.

            ## Output format — concise, structured, skimmable

            Post every specific finding as an INLINE comment on the exact
            file+line via mcp__github_inline_comment__create_inline_comment.
            Never list specific findings in the top-level summary. Omit any
            finding you cannot tie to a line.

            Each inline comment = a category emoji + a short bold title + 1-2
            plain sentences on what is wrong and why it matters, then an
            optional ```suggestion``` block with the concrete fix. Example:

              🐛 **Off-by-one skips the last item**
              The loop bound stops one element short, so the final item is
              never processed.
              ```suggestion
                  for (let i = 0; i < n; i++) {
              ```

            Pick one category emoji per finding:
            🐛 correctness/bug · 🔒 security · ⚡ performance · 🧹 maintainability

            Top-level summary:
              If there are no findings, post exactly:
                `### ✅ LGTM`
                `No issues found.`
              Do not include checklists, issue-count rows, "see inline
              comments", or extra commentary for a clean review.

              If there are findings, post exactly two short lines:
                `### ⚠️ N issue(s) found`
                `🐛 1 · 🔒 0 · ⚡ 0 · 🧹 2 — see inline comments.`
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/comments:*),Read,Grep,Glob"
