[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ac-cli"
version = "0.1.0"
description = "AgencyCore CLI — authenticate and interact with the AgencyCore API"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "httpx>=0.27",
    "supabase>=2.0",
    "rich>=13.0",
]

[project.scripts]
ac = "ac_cli.main:app"
