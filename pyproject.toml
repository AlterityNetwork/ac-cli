[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ac-cli"
version = "0.1.0"
description = "AgencyCore CLI — authenticate and interact with the AgencyCore API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
    "supabase>=2.0",
    "rich>=13.0",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ac = "ac_cli.main:app"
