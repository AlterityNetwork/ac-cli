[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agencycore-cli"
dynamic = ["version"]
description = "AgencyCore CLI — manage your CRM, outreach, and more from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AlterityNetwork", email = "dev@agencycore.dev" },
]
keywords = ["crm", "cli", "agencycore", "sales", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
    "supabase>=2.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-watch>=4.2",
    "pytest-xdist>=3.8.0",
    "respx>=0.22",
    "ruff>=0.15.13",
    "vulture>=2.16",
]

[project.urls]
Homepage = "https://github.com/AlterityNetwork/ac-cli"
Repository = "https://github.com/AlterityNetwork/ac-cli"
Issues = "https://github.com/AlterityNetwork/ac-cli/issues"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "." }

[tool.hatch.build.hooks.vcs]
version-file = "src/ac_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ac_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ac_cli --cov-report=term-missing:skip-covered --cov-fail-under=90 -n auto --dist worksteal --maxfail=1"

[tool.coverage.run]
# sys.monitoring backend (Python 3.12+, coverage>=7.6) — faster than the default
# sys.settrace path. Combined with -n auto, the suite runs in a fraction of the
# single-process time.
core = "sysmon"
source = ["src/ac_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".eggs", ".git", ".mypy_cache", ".venv",
    "_build", "build", "dist", "htmlcov", "coverage",
    "src/ac_cli/_version.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ac_cli"]

[tool.ruff.format]
quote-style = "double"

[tool.deptry]
known_first_party = ["ac_cli"]
extend_exclude = ["tests"]

[tool.vulture]
paths = ["src"]
exclude = ["tests/", "scripts/", ".venv/", "dist/", "build/"]
min_confidence = 80
sort_by_size = true
ignore_names = ["test_*", "_*"]

[project.scripts]
ac = "ac_cli.main:app"
