[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agencycore-cli"
dynamic = ["version"]
description = "AgencyCore CLI — manage your CRM, outreach, and more from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AlterityNetwork", email = "dev@agencycore.dev" },
]
keywords = ["crm", "cli", "agencycore", "sales", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
    "supabase>=2.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-watch>=4.2",
    "pytest-xdist>=3.8.0",
    "respx>=0.22",
    "vulture>=2.16",
]

[project.urls]
Homepage = "https://github.com/AlterityNetwork/ac-cli"
Repository = "https://github.com/AlterityNetwork/ac-cli"
Issues = "https://github.com/AlterityNetwork/ac-cli/issues"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "." }

[tool.hatch.build.hooks.vcs]
version-file = "src/ac_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ac_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ac_cli --cov-report=term-missing:skip-covered -n auto --dist worksteal"

[tool.coverage.run]
# sys.monitoring backend (Python 3.12+, coverage>=7.6) — ~30% faster than the
# default sys.settrace path. Combined with -n auto, full suite drops 92s → ~17s.
core = "sysmon"
source = ["src/ac_cli"]

[tool.deptry]
known_first_party = ["ac_cli"]
extend_exclude = ["tests"]

[tool.vulture]
paths = ["src"]
exclude = ["tests/", "scripts/", ".venv/", "dist/", "build/"]
min_confidence = 80
sort_by_size = true
ignore_names = ["test_*", "_*"]

[project.scripts]
ac = "ac_cli.main:app"
